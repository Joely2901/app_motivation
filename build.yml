name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Installer Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer "cython<3.1"

      - name: Compiler l'APK
        run: |
          set +e
          buildozer -v android debug > build.log 2>&1
          echo $? > exit_code.txt
          tail -n 300 build.log > erreur.txt
          exit $(cat exit_code.txt)

      - name: Garder le résumé de l'erreur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erreur
          path: erreur.txt

      - uses: actions/upload-artifact@v4
        with:
          name: motivation-apk
          path: bin/*.apk
